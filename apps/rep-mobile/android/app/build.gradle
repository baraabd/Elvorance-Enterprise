apply plugin: 'com.android.application'

def releaseSigning = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
def hasReleaseSigning = releaseSigning.every { System.getenv(it) }
if (releaseSigning.any { System.getenv(it) } && !hasReleaseSigning) {
    throw new GradleException('All Android release signing variables must be provided together.')
}
def releaseCode = System.getenv('ELVORANCE_VERSION_CODE') ?: '1'
if (!(releaseCode ==~ /[1-9][0-9]{0,8}/)) throw new GradleException('Invalid Android version code.')

android {
    namespace = "com.elvorance.rep"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.elvorance.rep"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseCode.toInteger()
        versionName System.getenv('ELVORANCE_VERSION_NAME') ?: "2.4.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions += "environment"
    productFlavors {
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
        }
        production { dimension "environment" }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            distribution {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.distribution
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Refuse a production APK/AAB containing a staging callback or vice versa.
    applicationVariants.all { variant ->
        variant.preBuildProvider.configure {
            doFirst {
                def configFile = file('src/main/assets/capacitor.config.json')
                if (!configFile.exists()) throw new GradleException('Run the rep-native preparation script first.')
                def config = new groovy.json.JsonSlurper().parse(configFile)
                if (config.appId != variant.applicationId) {
                    throw new GradleException('Packaged Capacitor identity does not match the Android variant.')
                }
            }
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def createsRelease = graph.allTasks.any { task -> task.path ==~ /:app:(bundle|assemble|package).*Release/ }
    if (createsRelease && !hasReleaseSigning && !project.hasProperty('allowUnsignedRelease')) {
        throw new GradleException('Release signing is required; verification-only builds may explicitly set -PallowUnsignedRelease.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.browser:browser:1.9.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
