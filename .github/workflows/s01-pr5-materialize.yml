name: S01 materialize reviewed PR5 repair
on:
  push:
    branches: [s01/pr5-reconcile-materialize-20261123]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: transport
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a255f2d987a2e0992965ff9147d1ea7b78b2b9d6
          path: candidate
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify exact reviewed payload and apply only allowed files
        working-directory: candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          root=Path.cwd().resolve()
          compressed=base64.b64decode(''.join((root.parent/'transport'/'.s01-pr5-transport'/f'part{i}.txt').read_text() for i in range(4)),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='9c50d1fab833971ca91fd8b56255bbb048a63955e7da3ca927276714a7e10742','Transport digest mismatch'
          data=json.loads(gzip.decompress(compressed))
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==data['base']=='a255f2d987a2e0992965ff9147d1ea7b78b2b9d6'
          allowed={'services/api-gateway/src/app.ts','tests/backend/gateway-input-errors.test.ts','tests/production/sprint01-inventory.test.mts','tooling/scripts/sprint01-inventory.mts','tsconfig.json','docs/audits/sprint-01/RECONCILIATION-20261123.md'}
          assert set(data['files'])==allowed
          assert data['delete']==['tests/backend/sprint01-inventory.test.ts']
          for name,content in data['files'].items():
              path=root/name
              assert root in path.resolve().parents
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(content.encode('utf-8'))
          for name in data['delete']:(root/name).unlink()
          path=root/'docs/audits/sprint-01/README.md'
          original=path.read_bytes(); prepend=data['prependReadme']
          assert hashlib.sha256(original).hexdigest()==prepend['beforeSha256']
          updated=prepend['prefix'].encode()+original
          assert hashlib.sha256(updated).hexdigest()==prepend['afterSha256']
          path.write_bytes(updated)
          (root.parent/'reviewed-payload.json').write_text(json.dumps(data))
          assert hashlib.sha256((root/'docs/production/debt-baseline.json').read_bytes()).hexdigest()==data['debtSha256']
          print('Exact reviewed source payload applied; legacy debt baseline unchanged.')
          PY
      - run: npm install --global npm@11.19.0
      - run: npm ci
        working-directory: candidate
      - name: Regenerate source inventories without resetting debt baselines
        working-directory: candidate
        run: npm run inventory:write
      - name: Extend only the preserved test floor
        working-directory: candidate
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          import {canonical} from './tooling/production/inventory.mts';
          const path='docs/production/quality-baseline.json';
          const baseline=JSON.parse(await readFile(path,'utf8'));
          const inventory=JSON.parse(await readFile('docs/production/feature-matrix.json','utf8'));
          const reviewed=JSON.parse(await readFile('../reviewed-payload.json','utf8'));
          assert.equal(baseline.testIds.length,reviewed.preservedOldTestIds);
          const ids=inventory.tests.map(row=>row.id).sort();
          assert(baseline.testIds.every(id=>ids.includes(id)));
          baseline.testIds=ids;
          await writeFile(path,await canonical(process.cwd(),baseline));
          JS
      - name: Verify all generated bytes against the locally reviewed source
        working-directory: candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path.cwd(); data=json.loads((root.parent/'reviewed-payload.json').read_text())
          for path,digest in data['expectedGenerated'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==digest,f'Generated source differs: {path}'
          assert json.loads((root/'docs/production/feature-matrix.json').read_text())['sourceDigest']==data['sourceDigest']
          assert hashlib.sha256((root/'docs/production/debt-baseline.json').read_bytes()).hexdigest()==data['debtSha256']
          allowed=set(data['files'])|set(data['delete'])|set(data['expectedGenerated'])|{'docs/audits/sprint-01/README.md'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())|set(subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).splitlines())
          assert changed<=allowed,f'Unexpected changes: {changed-allowed}'
          print('Reviewed source and generated inventory digests match exactly.')
          PY
      - run: npm run check:types
        working-directory: candidate
      - run: npm run test:production
        working-directory: candidate
      - run: npm run check:format
        working-directory: candidate
      - name: Verify supplemental diagnostic against all current domain registrations
        working-directory: candidate
        run: node tooling/scripts/sprint01-inventory.mts . dist/supplementary-inventory.json reviewed-candidate
      - name: Publish only the verified source on an isolated materialization branch
        working-directory: candidate
        shell: bash
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/api-gateway/src/app.ts tests/backend/gateway-input-errors.test.ts tests/backend/sprint01-inventory.test.ts tests/production/sprint01-inventory.test.mts tooling/scripts/sprint01-inventory.mts tsconfig.json docs/audits/sprint-01/README.md docs/audits/sprint-01/RECONCILIATION-20261123.md docs/production/architecture-inventory.json docs/production/data-flow-inventory.json docs/production/feature-matrix.json docs/production/ownership-dependency-map.json docs/production/semantic-review.json docs/production/quality-baseline.json docs/production/workflow-debt.json
          git commit -m 'fix(s01): reconcile audit diagnostics with canonical inventory and preserve gateway assertions'
          git push origin HEAD:refs/heads/s01/pr5-materialized-20261123
          python3 - <<'PY'
          import json,subprocess,os
          from pathlib import Path
          result={'status':'SOURCE_MATERIALIZED_NOT_FULL_CI','base':'a255f2d987a2e0992965ff9147d1ea7b78b2b9d6','commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),'sourceDigest':'6bf0225b36b0247eec1de7fc1840361a55200b4c72eb91c3396b0483987e1413'}
          Path(os.environ['RUNNER_TEMP'],'pr5-publication.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s01-pr5-reviewed-publication
          path: ${{ runner.temp }}/pr5-publication.json
          if-no-files-found: error
          retention-days: 14
