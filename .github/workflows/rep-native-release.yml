name: Rep signed native release
on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        default: staging
        required: true
      version_name:
        description: Three-component marketing version
        type: string
        required: true
      version_code:
        description: New positive build number for both stores
        type: string
        required: true
      ios_export_method:
        type: choice
        options: [app-store-connect, release-testing]
        default: app-store-connect
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: rep-signed-${{ inputs.environment }}
  cancel-in-progress: false
env:
  APP_ENV: ${{ inputs.environment }}
  ELVORANCE_VERSION_NAME: ${{ inputs.version_name }}
  ELVORANCE_VERSION_CODE: ${{ inputs.version_code }}
  IOS_EXPORT_METHOD: ${{ inputs.ios_export_method }}
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 25
    env:
      REP_API_BASE_URL: ${{ vars.REP_API_BASE_URL }}
      REP_OIDC_ISSUER: ${{ vars.REP_OIDC_ISSUER }}
      REP_OIDC_CLIENT_ID: ${{ vars.REP_OIDC_CLIENT_ID }}
      REP_PRODUCTION_API_BASE_URL: ${{ vars.REP_PRODUCTION_API_BASE_URL }}
      REP_STAGING_ACCEPTED_SOURCE_SHA: ${{ vars.REP_STAGING_ACCEPTED_SOURCE_SHA }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - name: Require staging acceptance of this exact source before production
        if: inputs.environment == 'production'
        run: node --input-type=module -e 'if (!process.env.REP_STAGING_ACCEPTED_SOURCE_SHA || process.env.REP_STAGING_ACCEPTED_SOURCE_SHA !== process.env.GITHUB_SHA) throw new Error("This source revision has no accepted staging evidence.");'
      - name: Obtain reviewed staging evidence
        if: inputs.environment == 'production'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rep-staging-acceptance
          path: dist/staging-acceptance
          run-id: ${{ vars.REP_STAGING_ACCEPTANCE_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Validate staging business-flow and physical-device evidence
        if: inputs.environment == 'production'
        run: node tooling/scripts/rep-release/check-acceptance.mts dist/staging-acceptance/acceptance.json "$GITHUB_SHA"
      - run: node tooling/scripts/rep-native/release-preflight.mts
      - run: npm run verify
  android:
    needs: preflight
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 40
    env:
      REP_API_BASE_URL: ${{ vars.REP_API_BASE_URL }}
      REP_OIDC_ISSUER: ${{ vars.REP_OIDC_ISSUER }}
      REP_OIDC_CLIENT_ID: ${{ vars.REP_OIDC_CLIENT_ID }}
      REP_PRODUCTION_API_BASE_URL: ${{ vars.REP_PRODUCTION_API_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build:rep:server
      - run: node tooling/scripts/rep-native/prepare.mts android
      - name: Install environment upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs';
          import { join } from 'node:path';
          const encoded = process.env.ANDROID_UPLOAD_KEYSTORE_BASE64;
          if (!encoded) throw new Error('Android upload keystore is required.');
          const path = join(process.env.RUNNER_TEMP, 'elvorance-upload.keystore');
          writeFileSync(path, Buffer.from(encoded, 'base64'), { mode: 0o600 });
          appendFileSync(process.env.GITHUB_ENV, `ANDROID_KEYSTORE_PATH=${path}\n`);
          NODE
      - name: Build and verify signed AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node tooling/scripts/rep-native/android-release.mts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rep-${{ inputs.environment }}-signed-android-${{ github.sha }}
          path: |
            apps/rep-mobile/android/app/build/outputs/bundle/*Release/*.aab
            dist/rep-native/android-release.json
            apps/rep-mobile/dist/rep-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary upload keystore
        if: always()
        run: node --input-type=module -e 'import { rmSync } from "node:fs"; if (process.env.ANDROID_KEYSTORE_PATH) rmSync(process.env.ANDROID_KEYSTORE_PATH, {force:true});'
  ios:
    needs: preflight
    runs-on: macos-26
    environment: ${{ inputs.environment }}
    timeout-minutes: 50
    env:
      REP_API_BASE_URL: ${{ vars.REP_API_BASE_URL }}
      REP_OIDC_ISSUER: ${{ vars.REP_OIDC_ISSUER }}
      REP_OIDC_CLIENT_ID: ${{ vars.REP_OIDC_CLIENT_ID }}
      REP_PRODUCTION_API_BASE_URL: ${{ vars.REP_PRODUCTION_API_BASE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run build:rep:server
      - run: node tooling/scripts/rep-native/prepare.mts ios
      - name: Archive, export and verify signed IPA
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: node tooling/scripts/rep-native/ios-release.mts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rep-${{ inputs.environment }}-signed-ios-${{ github.sha }}
          path: |
            dist/rep-native/ios-release/export/*.ipa
            dist/rep-native/ios-release/App.xcarchive/dSYMs/
            dist/rep-native/ios-release.json
            apps/rep-mobile/dist/rep-build.json
          if-no-files-found: error
          retention-days: 14
      - name: Clean temporary signing material
        if: always()
        run: node tooling/scripts/rep-native/ios-signing-cleanup.mts
