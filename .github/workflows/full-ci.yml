name: Production foundations FULL-CI
on:
  pull_request:
  push:
    branches: [main, 'sprint/**']
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  project:
    uses: ./.github/workflows/verify.yml
  distributed:
    uses: ./.github/workflows/backend-runtime.yml
  native:
    uses: ./.github/workflows/rep-native-verification.yml
  identity:
    uses: ./.github/workflows/s01-identity.yml
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run ci:security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: s01-security-a${{ github.run_attempt }}
          path: dist/evidence-upload/security/
          if-no-files-found: error
          retention-days: 14
  full-ci:
    name: FULL-CI
    if: always()
    needs: [project, distributed, native, identity, security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: s01-*-a${{ github.run_attempt }}
          path: dist/downloaded-evidence/
      - name: Fail closed on missing gates, stale attempts and evidence mismatches
        if: always()
        env:
          S01_NEEDS: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tooling/production/gate.mts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: s01-full-ci-${{ github.event.pull_request.head.sha || github.sha }}-a${{ github.run_attempt }}
          path: dist/full-ci-aggregate/
          if-no-files-found: error
          retention-days: 30
