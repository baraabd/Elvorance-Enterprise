name: Verify Elvorance Enterprise
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:

  format-migration:
    # One-time normalization restricted to this repository's own migration branch.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'refactor/elvorance-typescript-monorepo' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted migration files if needed
        shell: bash
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply Prettier to TypeScript migration"
          git push origin HEAD:refs/heads/refactor/elvorance-typescript-monorepo
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: elvorance-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELVORANCE_TEST_POSTGRES_URL: postgresql://postgres:elvorance-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run check:format
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: elvorance-enterprise-source
          path: dist/Elvorance-Enterprise-*.zip
          retention-days: 14
  verify-windows:
    runs-on: windows-latest
    # The PostgreSQL integration test runs in the Ubuntu job above. This job
    # exercises the reported Windows build, path aliases and portable bundles.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm.cmd install --global npm@11.19.0
      - run: npm.cmd ci
      - run: npm.cmd run verify
      - run: npm.cmd run check:format
      - run: npm.cmd run package
      - uses: actions/upload-artifact@v4
        with:
          name: elvorance-enterprise-source-windows
          path: dist/Elvorance-Enterprise-*.zip
          retention-days: 14
