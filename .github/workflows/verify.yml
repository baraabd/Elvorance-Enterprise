name: Verify Elvorance Enterprise
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: elvorance-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELVORANCE_TEST_POSTGRES_URL: postgresql://postgres:elvorance-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Execute every required Linux project command
        run: node tooling/production/run-lane.mts project-linux
      - name: Upload immutable project-linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ci-project-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/full-ci/project-linux/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: elvorance-enterprise-source
          path: dist/Elvorance-Enterprise-*.zip
          if-no-files-found: error
          retention-days: 14
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    # POSIX-only and PostgreSQL logical gates execute without skips in verify above.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm.cmd install --global npm@11.19.0
      - run: npm.cmd ci
      - name: Execute Windows portability and all existing project suites
        run: node tooling/production/run-lane.mts project-windows
      - name: Upload immutable project-windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-ci-project-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/full-ci/project-windows/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: elvorance-enterprise-source-windows
          path: dist/Elvorance-Enterprise-*.zip
          if-no-files-found: error
          retention-days: 14
