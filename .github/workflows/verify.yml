name: Verify Elvorance Enterprise
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: elvorance-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ELVORANCE_TEST_POSTGRES_URL: postgresql://postgres:elvorance-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run ci:quality -- quality-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: s01-quality-linux-a${{ github.run_attempt }}
          path: dist/evidence-upload/quality-linux/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elvorance-enterprise-source-a${{ github.run_attempt }}
          path: dist/Elvorance-Enterprise-*.zip
          if-no-files-found: error
          retention-days: 14
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    # The single PostgreSQL test is required on Linux, complementary-only on Windows.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm.cmd install --global npm@11.19.0
      - name: Validate Windows repair script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('tooling/windows/repair-npm-install.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - run: npm.cmd ci
      - run: npm.cmd run ci:quality -- quality-windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: s01-quality-windows-a${{ github.run_attempt }}
          path: dist/evidence-upload/quality-windows/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: elvorance-enterprise-source-windows-a${{ github.run_attempt }}
          path: dist/Elvorance-Enterprise-*.zip
          if-no-files-found: error
          retention-days: 14
