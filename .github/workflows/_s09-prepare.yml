name: Prepare Sprint 09 review source
on:
  push:
    branches: ['qa/sprint09-verification-20261123']
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'baraabd/Elvorance-Enterprise' && github.ref == 'refs/heads/qa/sprint09-verification-20261123'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Preserve strictness and extend the existing persisted journey
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import ts from 'typescript';
          // Only the reviewed added length guard changes this shared authorization anchor.
          // No binding rationale, route coverage, test gap, or baseline is waived.
          const bindingsPath = 'docs/production/semantic-bindings.json';
          const bindings = JSON.parse(fs.readFileSync(bindingsPath, 'utf8'));
          const authPath = 'packages/service-kit/src/auth.ts';
          assert.equal(bindings.evidenceFiles[authPath], '2787ba1fbf0548f551a04264f3e5ea883af608a1ad6c93d90e115330845de15c');
          const auth = fs.readFileSync(authPath, 'utf8');
          const original = auth.replace('      claims.roles.length > 0 &&\n', '');
          assert.notEqual(original, auth);
          assert.equal(createHash('sha256').update(original).digest('hex'), bindings.evidenceFiles[authPath]);
          bindings.evidenceFiles[authPath] = createHash('sha256').update(auth).digest('hex');
          fs.writeFileSync(bindingsPath, JSON.stringify(bindings, null, 2)+'\n');
          for (const path of ['tests/backend/authorization-matrix.test.ts', 'tests/acceptance/postgres-recovery.mts']) {
            let text = fs.readFileSync(path, 'utf8');
            const source = ts.createSourceFile(path, text, ts.ScriptTarget.Latest, true);
            const edits = [];
            function visit(node) {
              if (ts.isNonNullExpression(node)) {
                edits.push([node.getStart(source), node.end, `requiredValue(${node.expression.getText(source)})`]);
                return;
              }
              ts.forEachChild(node, visit);
            }
            visit(source);
            for (const [start, end, replacement] of edits.sort((a,b) => b[0]-a[0])) text = text.slice(0,start)+replacement+text.slice(end);
            if (edits.length) text += '\nfunction requiredValue<T>(value: T | undefined): T {\n  if (value === undefined) throw new Error("Required test fixture is missing");\n  return value;\n}\n';
            fs.writeFileSync(path, text);
          }
          const path = 'tests/runtime/compose-journey.mts';
          let text = fs.readFileSync(path, 'utf8');
          function replace(old, value) { assert.equal(text.split(old).length, 2, 'Expected one reviewed source anchor: '+old); text = text.replace(old,value); }
          replace('      totalMinor: 1,', '      totalMinor: 1,\n      discountMinor: 2000,');
          replace("{ id: 'deposit', label: 'CI deposit', amountMinor: 4000, dueOn: null }", "{ id: 'deposit', label: 'CI deposit', amountMinor: 3200, dueOn: null }");
          replace("{ id: 'balance', label: 'CI balance', amountMinor: 6000, dueOn: null }", "{ id: 'balance', label: 'CI balance', amountMinor: 4800, dueOn: null }");
          replace('quote.totalMinor === 10000', 'quote.totalMinor === 8000');
          replace('contract.totalMinor === 10000', 'contract.totalMinor === 8000');
          const anchor = "  quote = await http.request<Quote>('POST', `/v1/sales/quotes/${quote.id}/send`, {";
          const lines = [
            '  // A 20% discount requires a distinct administrator commercial review.',
            "  const blocked = await http.request<{ error: { code: string } }>('POST', `/v1/sales/quotes/${quote.id}/send`, { token: rep, body: { expectedVersion: quote.version }, status: 409 });",
            "  ensure(blocked.error.code === 'DISCOUNT_APPROVAL_REQUIRED', 'Unreviewed discount must not be sent.');",
            "  const review = await http.request<{ id: string; version: number; status: string }>('POST', `/v1/sales/quotes/${quote.id}/discount-approval`, { token: rep, body: { expectedVersion: quote.version, reason: 'CI synthetic 20% commercial exception' } });",
            "  ensure(review.status === 'pending', 'Commercial review must start pending.');",
            "  const reviewBody = { expectedVersion: review.version, decision: 'approved', note: 'CI synthetic approval; no real agreement' };",
            "  await http.request('POST', `/v1/sales/quote-discount-approvals/${review.id}/decision`, { token: rep, body: reviewBody, status: 403 });",
            "  const reviewed = await http.request<{ status: string }>('POST', `/v1/sales/quote-discount-approvals/${review.id}/decision`, { token: admin, body: reviewBody });",
            "  ensure(reviewed.status === 'approved', 'A distinct administrator must approve the discounted content.');",
          ];
          replace(anchor, lines.join('\n')+'\n'+anchor);
          replace("passed('manual visit and quote use live CRM/catalog service boundaries');", "passed('representative discounted quote requires distinct administrator review through live CRM/sales boundaries');");
          fs.writeFileSync(path,text);
          const config = JSON.parse(fs.readFileSync('tsconfig.json','utf8'));
          for (const item of ['tests/acceptance/**/*.mts', 'tooling/scripts/run-acceptance.mts', 'tooling/qa/**/*.mts']) if (!config.include.includes(item)) config.include.push(item);
          fs.writeFileSync('tsconfig.json',JSON.stringify(config,null,2)+'\n');
          fs.unlinkSync('.github/workflows/_s09-prepare.yml');
          JS
      - name: Generate source-bound inventories without resetting any baseline
        run: |
          npx prettier --write tests/backend/authorization-matrix.test.ts tests/backend/security-and-gateway.test.ts tests/backend/sprint09-auth-regression.test.ts tests/acceptance/postgres-recovery.mts tests/runtime/compose-journey.mts tooling/qa/sprint09-matrix.mts tooling/scripts/run-acceptance.mts tsconfig.json .github/workflows/sprint09-qa.yml docs/qa/sprint09/README.md docs/production/semantic-bindings.json
          npm run check:types
          npm run inventory:write
          node tooling/qa/sprint09-matrix.mts --write
          git diff --exit-code -- docs/production/debt-baseline.json docs/production/quality-baseline.json docs/production/full-ci-contract.json
          npm run inventory:check
          npm run check:format
      - name: Publish only the requested review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/sprint09-verification-20261123
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/backend tests/acceptance tests/runtime/compose-journey.mts tooling/qa tooling/scripts/run-acceptance.mts tsconfig.json .github/workflows docs/production docs/qa
          git commit -m 'test(s09): bind strict QA matrix and cross-role recovery checks to source'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/qa/sprint09-verification-20261123
          unset auth GH_TOKEN
      - name: Archive published source for independent local regression
        run: |
          mkdir -p /tmp/sprint09-source
          git archive --format=tar.gz HEAD > /tmp/sprint09-source/source.tar.gz
          git rev-parse HEAD > /tmp/sprint09-source/sha.txt
          git rev-parse HEAD^{tree} > /tmp/sprint09-source/tree.txt
          git ls-tree -r HEAD > /tmp/sprint09-source/tree-manifest.txt
          sha256sum /tmp/sprint09-source/source.tar.gz > /tmp/sprint09-source/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sprint09-prepared-source
          path: /tmp/sprint09-source/
          if-no-files-found: error
          retention-days: 14
