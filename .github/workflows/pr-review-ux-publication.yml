name: Materialize browser-tested UX repair
on:
  push:
    branches: [repair/pr-integration-publish-20261124]
    paths: [.github/workflows/pr-review-ux-publication.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: npm install --global npm@11.19.0
      - name: Reconcile the reviewed sources without changing acceptance criteria
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/ux-repair" a6cb0949591cdf4d49be9450b9f0a6de64258ad0
          cd "$RUNNER_TEMP/ux-repair"
          git config user.name 'Elvorance PR Repair'
          git config user.email 'elvorance-pr-repair@users.noreply.github.com'
          python3 - <<'PY'
          import base64,hashlib,json,pathlib,subprocess,zlib
          P=pathlib.Path
          payload=''
          data=json.loads(zlib.decompress(base64.b64decode(payload)))
          def git(*args,check=True):
              p=subprocess.run(['git',*args],text=True,capture_output=True)
              if check and p.returncode: raise RuntimeError(p.stdout+p.stderr)
              return p.stdout.strip()
          original='a6cb0949591cdf4d49be9450b9f0a6de64258ad0'
          predecessor='1012b059a088edb3d7b651489aca42b229fb5f16'
          git('merge','--no-ff','--no-commit',predecessor,check=False)
          generated={'docs/production/'+name+'.json' for name in ['architecture-inventory','data-flow-inventory','feature-matrix','ownership-dependency-map','semantic-review','workflow-debt']}
          manual={'apps/admin-web/src/main.ts','apps/rep-mobile/src/server/ui/dom.ts','tooling/scripts/build-apps.mts','tsconfig.json'}
          conflicts=set(git('diff','--name-only','--diff-filter=U').splitlines())
          if not conflicts<=generated|manual|{'docs/production/semantic-bindings.json'}: raise RuntimeError('Unexpected conflict: '+str(conflicts))
          for path in conflicts & (generated|manual): git('checkout','--ours','--',path)
          subprocess.run(['git','apply','-'],input=data['patch'],text=True,check=True)
          path='docs/production/semantic-bindings.json'
          missing=object()
          def load(ref): return json.loads(git('show',ref+':'+path))
          def merge(b,l,r,p=''):
              if l==r: return l
              if l==b: return r
              if r==b: return l
              if isinstance(l,dict) and isinstance(r,dict) and (isinstance(b,dict) or b is missing):
                  b={} if b is missing else b;out={}
                  for k in dict.fromkeys([*l,*r]):
                      v=merge(b.get(k,missing),l.get(k,missing),r.get(k,missing),p+'/'+k)
                      if v is not missing:out[k]=v
                  return out
              if isinstance(l,list) and isinstance(r,list) and (isinstance(b,list) or b is missing):
                  b=[] if b is missing else b
                  if all(isinstance(x,dict) and 'featureId' in x for x in [*b,*l,*r]):
                      bm,lm,rm=[{x['featureId']:x for x in xs} for xs in (b,l,r)];out=[]
                      for k in dict.fromkeys([*lm,*rm]):
                          v=merge(bm.get(k,missing),lm.get(k,missing),rm.get(k,missing),p+'/'+k)
                          if v is not missing:out.append(v)
                      return out
                  if all(isinstance(x,str) for x in [*b,*l,*r]): return list(dict.fromkeys([x for x in [*l,*r] if x not in b or (x in l and x in r)]))
              if p.startswith('/bindings/'):
                  key,field=p.removeprefix('/bindings/').rsplit('/',1)
                  if key in data['bindings'] and field in ('sourceFingerprint','sourceFileSha256'): return data['bindings'][key][field]
              if p.startswith('/evidenceFiles/') and p.removeprefix('/evidenceFiles/') in data['evidence']: return data['evidence'][p.removeprefix('/evidenceFiles/')]
              raise RuntimeError('Unreviewed semantic conflict: '+p)
          doc=merge(load('453242e1256f6d876d170142b8ad235be9120344'),load(original),load(predecessor))
          for binding in doc['bindings']:
              if binding['featureId'] in data['bindings']:
                  reviewed=data['bindings'][binding['featureId']]
                  if hashlib.sha256(P(reviewed['path']).read_bytes()).hexdigest()!=reviewed['sourceFileSha256']:raise RuntimeError('Reviewed source differs')
                  for field in ('sourceFingerprint','sourceFileSha256'):binding[field]=reviewed[field]
          for source,digest in data['evidence'].items():
              if hashlib.sha256(P(source).read_bytes()).hexdigest()!=digest:raise RuntimeError('Reviewed evidence differs')
              doc['evidenceFiles'][source]=digest
          P(path).write_text(json.dumps(doc,indent=2,ensure_ascii=False)+'\n')
          subprocess.run(['npm','ci'],check=True)
          subprocess.run(['npx','prettier','--write',*sorted(manual),path],check=True)
          subprocess.run(['npm','run','inventory:write'],check=True)
          git('add','-u')
          git('diff','--cached','--check','--','.',':!*.tsv')
          tree=git('write-tree')
          if tree!='74f1f8f20027f1d61da5b304623287d010b87856':raise RuntimeError('Exact reviewed tree mismatch: '+tree)
          git('commit','-m','fix(pr19): reconcile shared UX with integrated apps and repair contrast and narrow tables')
          git('branch','repair/validated-pr19-20261124')
          print(json.dumps({'pr':19,'sha':git('rev-parse','HEAD'),'tree':tree}))
          PY
      - name: Publish only the exact reviewed temporary ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/ux-repair"
          gh auth setup-git
          git push origin refs/heads/repair/validated-pr19-20261124
