name: S01 initialize reviewed inventories
on:
  push:
    branches: [work/s01-source-ci-20261122]
permissions:
  contents: read
jobs:
  initialize:
    if: github.repository == 'baraabd/Elvorance-Enterprise'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Generate initial inventories from reviewed plaintext source
        run: npm run inventory:write -- --initialize-debt
      - name: Normalize documentation formatting
        run: npx --no-install prettier --write 'docs/production/*.md'
      - name: Validate generated inventories and foundation tests
        run: |
          npm run check:types
          npm run test:production
          npm run inventory:check
          npm run check:format
      - name: Commit only production inventories on the dedicated review branch
        env:
          REVIEW_BRANCH: work/s01-source-ci-20261122
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$REVIEW_BRANCH"
          test "$(git ls-remote origin "refs/heads/$REVIEW_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/production/
          git diff --cached --check
          git commit -m 'chore(s01): persist source-derived inventories and initial debt baselines'
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
