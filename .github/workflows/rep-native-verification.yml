name: Rep native verification
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rep-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run ci:quality -- native-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: s01-native-linux-a${{ github.run_attempt }}
          path: dist/evidence-upload/native-linux/
          if-no-files-found: error
          retention-days: 14
      - name: Package reproducible diagnostic toolchain
        if: always()
        run: |
          mkdir -p /tmp/elvorance-toolchain
          cp "$(command -v node)" /tmp/elvorance-toolchain/node
          tar -czf /tmp/elvorance-toolchain/dependencies.tar.gz node_modules
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/elvorance-toolchain/source-sha.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rep-linux-verification-toolchain-a${{ github.run_attempt }}
          path: /tmp/elvorance-toolchain/
          retention-days: 1
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Prepare native-only verification harness
        run: node tooling/scripts/rep-native/prepare-verification.mts android
      - name: Lint, unit-test and compile an unsigned verification bundle
        working-directory: apps/rep-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon -PallowUnsignedRelease lintStagingRelease testStagingDebugUnitTest bundleStagingRelease
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Test Keystore, tamper rejection and native startup on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./apps/rep-mobile/android/gradlew -p apps/rep-mobile/android --no-daemon connectedStagingDebugAndroidTest
      - name: Capture Android source, JUnit totals and output digests
        if: always()
        env:
          S01_JOB_STATUS: ${{ job.status }}
        run: node tooling/production/evidence.mts native-android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: s01-native-android-a${{ github.run_attempt }}
          path: dist/evidence-upload/native-android/
          if-no-files-found: error
          retention-days: 14
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Prepare native-only verification harness
        run: node tooling/scripts/rep-native/prepare-verification.mts ios
      - name: Test redirect policy and Keychain on an iPhone simulator
        run: |
          set -o pipefail
          node tooling/scripts/rep-native/ios-verification.mts | tee ios-verification.log
      - name: Capture iOS source, simulator totals and result digests
        if: always()
        env:
          S01_JOB_STATUS: ${{ job.status }}
        run: node tooling/production/evidence.mts native-ios
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: s01-native-ios-a${{ github.run_attempt }}
          path: dist/evidence-upload/native-ios/
          if-no-files-found: error
          retention-days: 14
