name: Enterprise UX
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BASE_SHA: ${{ github.event.pull_request.base.sha || '453242e1256f6d876d170142b8ad235be9120344' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Install isolated pinned browser audit tools
        shell: bash
        run: |
          (cd tests/ux/tooling && npm ci --ignore-scripts && npm audit --audit-level=high)
          python3 -m venv "$RUNNER_TEMP/ux-venv"
          "$RUNNER_TEMP/ux-venv/bin/pip" install -r tests/ux/requirements.txt
          "$RUNNER_TEMP/ux-venv/bin/python" -m playwright install --with-deps chromium
          echo "$RUNNER_TEMP/ux-venv/bin" >> "$GITHUB_PATH"
      - name: Record source identity and build original and candidate
        shell: bash
        run: |
          [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir -p dist/ux-evidence
          git rev-parse HEAD > dist/ux-evidence/candidate-sha.txt
          printf '%s\n' "$BASE_SHA" > dist/ux-evidence/baseline-sha.txt
          sha256sum package-lock.json > dist/ux-evidence/lock-sha256.txt
          node --version > dist/ux-evidence/node-version.txt
          python --version > dist/ux-evidence/python-version.txt
          git worktree add --detach "$RUNNER_TEMP/ux-before" "$BASE_SHA"
          (cd "$RUNNER_TEMP/ux-before" && npm ci && npm run build:apps)
          npm run check:types
          npm run build:apps
          node tests/ux/build-server-fixture.mts "$RUNNER_TEMP/ux-before" dist/ux-evidence/baseline/server-build --before
          node tests/ux/build-server-fixture.mts . dist/ux-evidence/after/server-build
          CHROMIUM=$(python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          echo "CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          "$CHROMIUM" --version > dist/ux-evidence/browser-version.txt
      - name: Real browser baseline, accessibility and responsive comparison
        shell: bash
        run: |
          E=dist/ux-evidence
          AXE=tests/ux/tooling/node_modules/axe-core/axe.min.js
          python tests/ux/browser_audit.py --chromium "$CHROMIUM" --dist "$RUNNER_TEMP/ux-before/dist" --output "$E/baseline/screens" --axe "$AXE" --screenshots
          python tests/ux/server_audit.py --chromium "$CHROMIUM" --build "$E/baseline/server-build" --output "$E/baseline/server-screens" --axe "$AXE" --states --screenshots
          python tests/ux/browser_audit.py --chromium "$CHROMIUM" --output "$E/after/screens" --axe "$AXE" --screenshots --strict
          python tests/ux/server_audit.py --chromium "$CHROMIUM" --build "$E/after/server-build" --output "$E/after/server-screens" --axe "$AXE" --states --screenshots --strict
          python tests/ux/interactions.py --chromium "$CHROMIUM" --server-build "$E/after/server-build" --output "$E/after/interactions"
      - name: Pixel regression evidence and deterministic repeat
        shell: bash
        run: |
          E=dist/ux-evidence
          python -m unittest discover -s tests/ux -p 'test_*.py' -v
          python tests/ux/browser_audit.py --chromium "$CHROMIUM" --output "$E/after/repeat" --widths 390,768,1440 --screenshots
          python tests/ux/visual_compare.py --before "$E/baseline/screens" --after "$E/after/screens" --repeat "$E/after/repeat" --output "$E/visual/demo" --diffs
          python tests/ux/visual_compare.py --before "$E/baseline/server-screens" --after "$E/after/server-screens" --output "$E/visual/server" --diffs
      - name: Upload real screenshots and exact-source audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: enterprise-ux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: dist/ux-evidence/
          if-no-files-found: error
          retention-days: 30
