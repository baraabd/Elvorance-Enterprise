name: Hosted staging tooling
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check:types
      - run: node tooling/scripts/hosted/build-ops.mts
      - run: node tooling/scripts/hosted/build-web.mts
        env:
          SOURCE_REVISION: ${{ github.sha }}
      - name: Upload server-only source-bound build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-web-build-provenance
          path: dist/hosted-web/*/build.json
          retention-days: 30
