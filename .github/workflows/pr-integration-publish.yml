name: Materialize reviewed PR integration trees
on:
  push:
    branches: [repair/pr-integration-publish-20261124]
    paths: [.github/workflows/pr-integration-publish.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'baraabd/Elvorance-Enterprise'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - run: npm install --global npm@11.19.0
      - name: Reproduce reviewed merges and reject any tree mismatch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/materialized"
          git worktree add --detach "$RUNNER_TEMP/integration" 8215497954325085a8de2eaeaf13daa88489982b
          cd "$RUNNER_TEMP/integration"
          npm ci
          git config user.name 'Elvorance PR Repair'
          git config user.email 'elvorance-pr-repair@users.noreply.github.com'
          export OUT="$RUNNER_TEMP/materialized"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          def git(*args,check=True):
              p=subprocess.run(['git',*args],text=True,capture_output=True)
              if check and p.returncode: raise RuntimeError(p.stdout+p.stderr)
              return p.stdout.strip()
          previous='8215497954325085a8de2eaeaf13daa88489982b'
          plans=[
              (14,'3600d5ad8876d5e71eaa8d35d4ec1d65fef5b6ea','8188129f5bc85bdbd1e89796a866253fb7f0b90f'),
              (16,'214c093feeaf812841fc858c5506f77976df3118','3cb501b71779dfd13c13d3d578f4c529868752a3')]
          generated=['architecture-inventory','data-flow-inventory','feature-matrix','ownership-dependency-map','semantic-review','workflow-debt']
          results=[]
          for number,original,expected_tree in plans:
              git('checkout','--detach',original)
              git('merge','--no-ff','--no-commit',previous,check=False)
              conflicts=git('diff','--name-only','--diff-filter=U').splitlines()
              allowed={'docs/production/'+name+'.json' for name in generated}
              if number==16: allowed.add('docs/production/semantic-bindings.json')
              if not set(conflicts)<=allowed: raise RuntimeError('Unexpected conflict: '+str(conflicts))
              for name in generated:
                  path='docs/production/'+name+'.json'
                  if path in conflicts: git('checkout','--ours','--',path)
              if number==16:
                  # Preserve every reviewed Sprint 03 native/security binding. Only the
                  # independently reviewed HTTP/proxy evidence changed during PR14.
                  path=pathlib.Path('docs/production/semantic-bindings.json')
                  doc=json.loads(git('show',original+':'+str(path)))
                  prior=json.loads(git('show',previous+':'+str(path)))
                  for source in ['packages/service-kit/src/http.ts','packages/service-kit/src/auth.ts','services/api-gateway/src/application/proxy.ts']:
                      digest=hashlib.sha256(pathlib.Path(source).read_bytes()).hexdigest()
                      if source in doc['evidenceFiles']: doc['evidenceFiles'][source]=digest
                      for binding in doc['bindings']:
                          if binding['featureId'].split(':')[1]==source: binding['sourceFileSha256']=digest
                  path.write_text(json.dumps(doc,indent=2,ensure_ascii=False)+'\n')
                  subprocess.run(['npx','prettier','--write',str(path)],check=True)
              subprocess.run(['npm','run','inventory:write'],check=True)
              git('add','-u')
              git('diff','--cached','--check')
              actual=git('write-tree')
              if actual!=expected_tree: raise RuntimeError(f'PR{number}: tree mismatch {actual} != {expected_tree}')
              git('commit','-m',f'fix(pr{number}): reconcile tested predecessor and preserve source-bound safeguards')
              commit=git('rev-parse','HEAD')
              git('branch',f'repair/validated-pr{number}-20261124',commit)
              results.append({'pr':number,'original':original,'sha':commit,'tree':actual,'predecessor':previous,'ref':f'repair/validated-pr{number}-20261124'})
              previous=commit
          pathlib.Path(os.environ['OUT'],'manifest.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - name: Publish verified objects only to isolated repair refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/integration"
          gh auth setup-git
          git push --atomic origin refs/heads/repair/validated-pr14-20261124 refs/heads/repair/validated-pr16-20261124
          # This job does not update main or any original PR branch, change checks,
          # approve PRs, merge PRs, or deploy applications.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reviewed-pr-tree-manifest-${{ github.sha }}
          path: ${{ runner.temp }}/materialized/
          if-no-files-found: error
          retention-days: 7
