name: Isolated acceptance verification
on:
  pull_request:
    paths:
      - 'apps/client-mobile/**'
      - 'services/**'
      - 'packages/**'
      - 'infra/identity/**'
      - 'tests/**'
      - 'tooling/**'
      - '.github/workflows/acceptance-verification.yml'
permissions:
  contents: read
concurrency:
  group: isolated-acceptance-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  authorization-recovery-load:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: acceptance-ci-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      ELVORANCE_DISPOSABLE_ACCEPTANCE: '1'
      ELVORANCE_TEST_POSTGRES_URL: postgresql://postgres:acceptance-ci-only@localhost:5432/postgres
      ELVORANCE_ACCEPTANCE_REPORT_DIR: dist/acceptance/evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check:types
      - run: node tooling/scripts/run-acceptance.mts authorization
      - run: node tooling/scripts/run-acceptance.mts postgres-recovery
        env:
          ELVORANCE_ACCEPTANCE_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-authorization-recovery-load
          path: dist/acceptance/evidence/
          if-no-files-found: error
          retention-days: 14
  oidc-synthetic-account:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      ELVORANCE_DISPOSABLE_ACCEPTANCE: '1'
      ELVORANCE_ACCEPTANCE_REPORT_DIR: dist/acceptance/evidence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Real isolated Keycloak with TLS and synthetic-account Authorization Code PKCE
        run: node tests/acceptance/keycloak-ci.mts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: isolated-oidc-synthetic-account
          path: dist/acceptance/evidence/
          if-no-files-found: warn
          retention-days: 14
  client-android-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELVORANCE_DISPOSABLE_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Build and sync the client demo shell only
        run: |
          npm run build:apps
          node tests/acceptance/prepare-client-shell.mts android
      - name: Compile, lint and unit-test the debug client shell
        run: |
          chmod +x apps/client-mobile/android/gradlew
          ./apps/client-mobile/android/gradlew -p apps/client-mobile/android --no-daemon lintStagingDebug testStagingDebugUnitTest assembleStagingDebug
      - run: sudo chmod 666 /dev/kvm
      - name: Verify actual client package identity on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./apps/client-mobile/android/gradlew -p apps/client-mobile/android --no-daemon :app:connectedStagingDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: client-android-demo-shell-only
          path: |
            apps/client-mobile/android/app/build/reports/
            apps/client-mobile/android/app/build/outputs/androidTest-results/
          retention-days: 7
  client-ios-shell:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      ELVORANCE_DISPOSABLE_ACCEPTANCE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Build and sync the client demo shell only
        run: |
          npm run build:apps
          node tests/acceptance/prepare-client-shell.mts ios
      - name: Build and launch the client shell on an iPhone simulator
        run: node tests/acceptance/client-ios-shell.mts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: client-ios-demo-shell-only
          path: dist/acceptance/client-ios-shell.json
          if-no-files-found: warn
          retention-days: 7
