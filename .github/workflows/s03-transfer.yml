name: S03 reviewed patch transfer
on:
  push:
    branches: [feat/sprint03-identity-isolation-20261123]
permissions:
  contents: read
concurrency:
  group: s03-reviewed-transfer
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'baraabd/Elvorance-Enterprise' && github.ref == 'refs/heads/feat/sprint03-identity-isolation-20261123' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Verify exact reviewed base and patch, then apply
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 453242e1256f6d876d170142b8ad235be9120344
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, subprocess, shutil
          chunks = [Path(f'.s03-transfer/{i}.b64').read_text().strip() for i in range(4)]
          # Correct transport transcription only; the complete decoded patch is SHA-256 pinned.
          for old, new in [('NfhMYiXN', 'NfhMYxXN'), ('M9TYh1KCU', 'M9Nh1KCU'), ('G016B3MMzMIw', 'G016B3MMwMIw')]:
              assert chunks[1].count(old) == 1
              chunks[1] = chunks[1].replace(old, new)
          patch = gzip.decompress(base64.b64decode(''.join(chunks), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'e5d2a41beb6fc267dbbb23307edcc9cafa14c72af72706129b757219a9068c50'
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=patch, check=True)
          shutil.rmtree('.s03-transfer')
          Path('.github/workflows/s03-transfer.yml').unlink()
          print('Reviewed patch verified and applied; temporary transport files excluded from inventory.')
          PY
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Rebuild unchanged mandatory inventories
        run: npm run inventory:write
      - name: Verify generated inventory against local reviewed snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'architecture-inventory': 'b7745b82e29fc4e0df487946f4ab53772346a8ae2ad33108aa8db1f3dc67185d',
            'data-flow-inventory': 'e8abce639e0af7558180a7924472c7350f354516549ecd27ab0b64c8404452d4',
            'feature-matrix': 'c724f38bcc317241e3c45f67928bb1f1a952840bd579f3a84f821296c6232b63',
            'ownership-dependency-map': 'ca23d8876e0d6adab4c0f1d97f4da2b2b48fade5c3a3140e98df149abeef5186',
            'semantic-review': '9f2ad223ef1a174c6ed7d52c778276d6771dd0850bddcf496648810256b75e59',
            'workflow-debt': '3b8bb0712f2db19876ff19f0d262e897c946bd612b1464006c7f77d313075870'
          }
          for name, digest in expected.items():
              actual = hashlib.sha256(Path(f'docs/production/{name}.json').read_bytes()).hexdigest()
              assert actual == digest, (name, actual)
          print('All six generated artifacts exactly match the reviewed local snapshot.')
          PY
          npm run inventory:check
          git diff --check
      - name: Commit only to the isolated work branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The connector, not this job token, finalizes workflow changes after transfer.
          git restore --source=HEAD -- .github/workflows/s03-transfer.yml .github/workflows/rep-native-verification.yml
          git add --all
          test -z "$(git diff --cached --name-only -- .github)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(security): implement reviewed Sprint 03 identity and tenant isolation'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/sprint03-identity-isolation-20261123
          git rev-parse HEAD
