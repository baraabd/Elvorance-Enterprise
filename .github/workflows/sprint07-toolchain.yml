name: Sprint 07 isolated verification toolchain
on:
  push:
    branches: [feat/sprint07-representative-20261123]
    paths: [.github/workflows/sprint07-toolchain.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Package locked dependencies for isolated, network-disabled verification
        run: |
          mkdir -p .toolchain
          cp "$(command -v node)" .toolchain/node
          node --version > .toolchain/version.txt
          sha256sum package-lock.json > .toolchain/lock.sha256
          tar -czf sprint07-toolchain.tar.gz node_modules .toolchain
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sprint07-toolchain-${{ github.sha }}
          path: sprint07-toolchain.tar.gz
          retention-days: 1
          if-no-files-found: error
