<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إلفورانس 2027 · معاينة بطاقات لوحة المندوب التفاعلية</title>
<style>
:root{--bg:#f4f6f2;--ink:#19271e;--muted:#718173;--line:#e2e9e1;--green:#13573e;--lime:#dbf49c;--white:#fff;--shadow:0 16px 36px #24492f0d}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:'Segoe UI',Tahoma,Arial,sans-serif;color:var(--ink);background:var(--bg)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #218968;outline-offset:3px}.wrap{max-width:1100px;margin:auto;padding:24px 20px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:0 0 26px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}.mark{background:var(--green);color:var(--lime);width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:24px}.hint{font-size:12px;color:var(--muted)}h1{font-size:clamp(23px,4vw,31px);letter-spacing:-.5px;margin:8px 0 8px}h2{font-size:20px;margin:0 0 9px}h3{font-size:17px;margin:0}.sub{color:var(--muted);margin:0 0 26px;font-size:14px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{position:relative;min-height:150px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:17px;text-align:right;color:var(--ink);transition:.2s ease;box-shadow:var(--shadow)}.stat:hover{border-color:#519b6e;transform:translateY(-2px);box-shadow:0 19px 36px #144b3220}.stat .label{font-size:12px;color:#687d70;display:flex;align-items:center;justify-content:space-between;gap:4px}.stat .value{font-size:34px;display:block;font-weight:800;margin:13px 0 8px;line-height:1.2;direction:ltr;text-align:right}.stat .note{font-size:11px;color:#849185}.arrow{position:absolute;bottom:15px;left:14px;color:#2d7454}.card{border-radius:20px;background:white;border:1px solid var(--line);padding:22px;box-shadow:var(--shadow)}.kicker{font-size:12px;font-weight:800;color:var(--green)}.context{background:#e9f4e9;border:1px solid #c8e5cd;border-radius:20px;padding:18px;margin:12px 0 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.context h2{margin:3px 0}.context .muted{margin:0}.btn{background:#fff;color:var(--green);border:1px solid #bad7be;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:800;display:inline-flex;align-items:center;gap:9px;white-space:nowrap}.btn:hover{background:#f4faf1}.muted{font-size:12px;color:var(--muted);line-height:1.8}.rows{display:grid;gap:12px}.row-card{width:100%;display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid var(--line);border-radius:18px;background:white;padding:18px 20px;text-align:right;color:inherit;transition:.2s}.row-card:hover{border-color:#69a57b;box-shadow:var(--shadow)}.title{font-weight:800;font-size:15px;display:block;margin:0 0 6px}.pill{font-size:11px;padding:5px 10px;border-radius:999px;background:#e9f5ec;color:#216244;white-space:nowrap}.value-small{font-weight:850;font-size:17px;direction:ltr}.tag{display:inline-block;font-size:12px;background:#ebf0e7;padding:7px 10px;border-radius:9px;color:#43644c}.empty{padding:60px 18px;text-align:center;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.detail-grid>div{background:#f3f6f2;border-radius:12px;padding:13px;font-size:13px}.detail-grid strong{display:block;margin-top:5px}.dark{background:#16271e;color:white;border-radius:22px;padding:26px;margin:22px 0}.dark p{color:#c5d9ca}.footer{color:var(--muted);margin-top:38px;font-size:12px;text-align:center;line-height:1.8}[hidden]{display:none!important}
@media(max-width:750px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{min-height:137px;padding:14px}.stat .value{font-size:29px}.context{align-items:stretch;flex-direction:column}.top{gap:8px}.wrap{padding:20px 14px 65px}}
@media(max-width:380px){.grid{gap:9px}.stat{padding:11px;min-height:135px}.stat .label{font-size:11px}.stat .value{font-size:26px}.row-card{padding:15px}}
@media(prefers-reduced-motion:reduce){.stat,.row-card{transition:none}.stat:hover{transform:none}}
</style>
</head>
<body><div class="wrap"><div class="top"><div class="brand"><span class="mark" aria-hidden="true">✣</span><span>إلفورانس <small style="font-size:10px;color:#708072">ELVORANCE CRM</small></span></div><span class="hint">نموذج مستقل للتفاعل مع بطاقات لوحة المندوب</span></div><main id="page" tabindex="-1" aria-live="polite"></main><div class="footer">بيانات توضيحية فقط · ليست مرتبطة بقاعدة بيانات إلفورانس أو جهاز ميداني حقيقي</div></div>
<script>
const original = {
 tasks:[
  {id:'t1',title:'متابعة تأكيد تصميم موقع مطعم الساحة',client:'مطعم الساحة',due:'2026-11-16',priority:'عالية',notes:'مراجعة خطة الموقع مع صاحب القرار',status:'open'},
  {id:'t2',title:'اتصال لمراجعة بنود عرض العيادة',client:'عيادة الشفاء',due:'2026-11-16',priority:'عادية',notes:'تأكيد عدد صفحات نظام الحجز',status:'open'},
  {id:'t3',title:'إرسال تفاصيل خطة التسويق',client:'متجر الياسمين',due:'2026-11-17',priority:'عالية',notes:'تجهيز ملخص متطلبات الإعلان',status:'open'},
  {id:'t4',title:'متابعة موعد زيارة الورشة',client:'ورشة النور',due:'2026-11-18',priority:'عادية',notes:'تأكيد وقت اللقاء',status:'open'},
  {id:'t5',title:'مراجعة محتوى الموقع',client:'مصنع الإتقان',due:'2026-11-19',priority:'عادية',notes:'استلام الصور والنصوص',status:'open'},
 ],
 opps:[
  {id:'o1',title:'موقع وحجوزات للمطعم',client:'مطعم الساحة',value:2100,stage:'qualified',notes:'انتظار تأكيد المتطلبات'},
  {id:'o2',title:'إدارة مواعيد المرضى',client:'عيادة الشفاء',value:4200,stage:'negotiation',notes:'مراجعة الأسعار'},
  {id:'o3',title:'متجر إلكتروني',client:'متجر الياسمين',value:3300,stage:'proposal',notes:'العرض لدى العميل'},
  {id:'o4',title:'نظام صيانة الورشة',client:'ورشة النور',value:2800,stage:'new',notes:'تحديد الاحتياج'},
  {id:'o5',title:'موقع تعريفي للمصنع',client:'مصنع الإتقان',value:1750,stage:'qualified',notes:'الخطوة التالية اجتماع'},
  {id:'o6',title:'إدارة مخزون مؤسسة الندى',client:'مؤسسة الندى',value:3200,stage:'won',notes:'العميل وافق على العرض'},
  {id:'o7',title:'حجوزات لخدمات البرج',client:'شركة البرج',value:4200,stage:'won',notes:'عقد معتمد'},
  {id:'o8',title:'موقع متعدد اللغات',client:'مكتب الأمانة',value:2200,stage:'won',notes:'صفقة مكتسبة'},
 ],
 quotes:[
  {id:'q1',title:'عرض الموقع وخدمات الحجز',client:'مطعم الساحة',total:1750,status:'sent',sentAt:'2026-11-14'},
  {id:'q2',title:'عرض خطة الحملات الرقمية',client:'متجر الياسمين',total:1250,status:'sent',sentAt:'2026-11-15'},
 ]
};
let seed;
try {seed=JSON.parse(sessionStorage.getItem('elvorance-drilldown-demo')||'null')||original;}catch{seed=original}
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const money=n=>'$'+Number(n||0).toLocaleString('en-US');
const list=(route,filter)=>route==='tasks'?seed.tasks.filter(t=>t.status===filter):route==='opportunities'?seed.opps.filter(o=>filter==='open'?!['won','lost'].includes(o.stage):o.stage===filter):route==='quotes'?seed.quotes.filter(q=>q.status===filter):[];
const metricData=()=>[
 {label:'مهام مفتوحة',number:String(list('tasks','open').length),route:'tasks',filter:'open',note:seed.tasks.filter(x=>x.status==='open'&&x.due<'2026-11-15').length+' متأخرة',icon:'☷'},
 {label:'فرص قيد العمل',number:String(list('opportunities','open').length),route:'opportunities',filter:'open',note:'قائمة الفرص غير المغلقة',icon:'▣'},
 {label:'قيمة الفرص المكتسبة',number:money(list('opportunities','won').reduce((a,o)=>a+o.value,0)),route:'opportunities',filter:'won',note:'مجموع الفرص المكتسبة',icon:'↗'},
 {label:'عروض تنتظر العميل',number:String(list('quotes','sent').length),route:'quotes',filter:'sent',note:'العروض المرسلة',icon:'▤'}
];
const titleFor=(r,f)=>r==='tasks'?'مهام مفتوحة':r==='quotes'?'عروض تنتظر العميل':f==='won'?'قيمة الفرص المكتسبة':'فرص قيد العمل';
const page=document.getElementById('page');
function nav(route='home',filter='',id='') {location.hash = route==='home'?'#home':`#${route}/${filter}${id?'/'+id:''}`; render();}
function render(){const hash=decodeURIComponent(location.hash.slice(1)||'home');const [route='home',filter='',id='']=hash.split('/');
 if(route==='home') {page.innerHTML=`<span class="kicker">لوحة تحكم المندوب</span><h1>يومك يبدأ بخطوة واضحة</h1><p class="sub">اضغط على أي بطاقة لفتح سجلاتها المفلترة، ثم اختر السجل لعرض تفاصيله.</p><div class="grid">${metricData().map(m=>`<button type="button" class="stat" data-route="${m.route}" data-filter="${m.filter}" aria-label="فتح ${m.label}: ${m.number}"><div class="label"><span>${esc(m.label)}</span><span aria-hidden="true">${m.icon}</span></div><strong class="value">${esc(m.number)}</strong><span class="note">${esc(m.note)}</span><span class="arrow" aria-hidden="true">‹</span></button>`).join('')}</div><section class="dark"><h2>كل رقم يقود إلى سجلاته</h2><p>أرقام البطاقات تعكس قوائم المهام والفرص والعروض في هذه المعاينة، وليست مجرد عناصر زخرفية.</p></section>`; return;}
 if(!['tasks','opportunities','quotes'].includes(route))return nav();
 const title=titleFor(route,filter);const rows=list(route,filter);const item=rows.find(x=>x.id===id);
 const back=`<button type="button" class="btn" data-route="${route}" data-filter="${filter}" ${id?'':'data-home="1"'}>← ${id?'العودة إلى القائمة':'لوحة التحكم'}</button>`;
 if(item){page.innerHTML=`<div class="context"><div><span class="kicker">${esc(title)} / تفاصيل السجل</span><h2>${esc(item.title)}</h2><p class="muted">${esc(item.client)}</p></div>${back}</div><section class="card"><div class="detail-grid">${Object.entries(item).filter(([k])=>!['id','title','client'].includes(k)).map(([k,v])=>`<div><span class="muted">${esc(({due:'موعد الاستحقاق',priority:'الأولوية',notes:'الملاحظات',status:'الحالة',stage:'مرحلة الفرصة',value:'قيمة الفرصة',total:'قيمة العرض',sentAt:'تاريخ الإرسال'})[k]||k)}</span><strong>${esc(k==='value'||k==='total'?money(v):v)}</strong></div>`).join('')}</div></section>`;return;}
 page.innerHTML=`<div class="context"><div><span class="kicker">من لوحة مؤشرات المندوب</span><h2>${esc(title)}</h2><p class="muted">${rows.length} سجلات مطابقة${filter==='won'?' · إجمالي القيمة: '+money(rows.reduce((a,x)=>a+x.value,0)):''}</p></div>${back}</div><div class="rows">${rows.length?rows.map(x=>`<button type="button" class="row-card" data-route="${route}" data-filter="${filter}" data-id="${esc(x.id)}"><span><span class="title">${esc(x.title)}</span><span class="muted">${esc(x.client)} · ${esc(x.due||x.sentAt||x.stage||'')}</span></span><span><span class="value-small">${'value'in x?money(x.value):'total'in x?money(x.total):'›'}</span><br><span class="pill">${esc(x.status==='sent'?'بانتظار العميل':x.status==='open'?'مفتوحة':x.stage==='won'?'مكتسبة':x.stage||'جارية')}</span></span></button>`).join(''):'<div class="card empty">لا توجد سجلات مطابقة لهذا المؤشر.</div>'}</div>`;
}
document.addEventListener('click',event=>{const el=event.target.closest('button[data-route]');if(!el)return;if(el.dataset.home)return nav();nav(el.dataset.route,el.dataset.filter,el.dataset.id);});
addEventListener('hashchange',render);render();
</script>
</body></html>
