# Standalone production reference; do not merge with the development Compose file.
# Requires real OIDC, reviewed image digests, and externally provisioned secret files.
name: ${COMPOSE_PROJECT_NAME:-atlas-production}
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set a reviewed immutable image digest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      IDENTITY_DB_PASSWORD_FILE: /run/secrets/identity_db_password
      CRM_DB_PASSWORD_FILE: /run/secrets/crm_db_password
      SALES_DB_PASSWORD_FILE: /run/secrets/sales_db_password
      DELIVERY_DB_PASSWORD_FILE: /run/secrets/delivery_db_password
      BILLING_DB_PASSWORD_FILE: /run/secrets/billing_db_password
      TRACKING_DB_PASSWORD_FILE: /run/secrets/tracking_db_password
      COMMUNICATIONS_DB_PASSWORD_FILE: /run/secrets/communications_db_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/010-service-databases.sh:/docker-entrypoint-initdb.d/010-service-databases.sh:ro
      - ./postgres/check-isolation.sh:/opt/atlas/check-isolation.sh:ro
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d postgres
      interval: 5s
      timeout: 5s
      retries: 20
    secrets:
      - postgres_admin_password
      - identity_db_password
      - crm_db_password
      - sales_db_password
      - delivery_db_password
      - billing_db_password
      - tracking_db_password
      - communications_db_password
  rabbitmq:
    image: ${RABBITMQ_IMAGE:?Set a reviewed immutable image digest}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-atlas}
      RABBITMQ_DEFAULT_VHOST: atlas
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ../docker/rabbitmq-secret-entrypoint.sh:/opt/atlas/rabbitmq-secret-entrypoint.sh:ro
    networks:
      - mesh
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 10s
      timeout: 5s
      retries: 15
    secrets:
      - rabbitmq_password
    entrypoint:
      - /bin/sh
      - /opt/atlas/rabbitmq-secret-entrypoint.sh
    command:
      - rabbitmq-server
  identity-migrate:
    restart: 'no'
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - mesh
      - data
    healthcheck:
      disable: true
    image: ${IDENTITY_IMAGE:?Set a reviewed service image digest}
    command:
      - --migrate-only
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      AUTH_MODE: oidc
      OIDC_ISSUER: ${OIDC_ISSUER:?Set the production issuer}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Set the API audience}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:?Set the issuer JWKS URL}
      AUTO_MIGRATE: 'false'
      PORT: '3001'
      DATABASE_URL_FILE: /run/secrets/identity_database_url
      RABBITMQ_URL_FILE: /run/secrets/rabbitmq_url
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - identity_database_url
      - rabbitmq_url
